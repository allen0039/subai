name: docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".planning/**"
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: allen0039/subai-server

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Prepare build identity
        id: build_identity
        run: |
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.build_identity.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.build_identity.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_TIME=${{ steps.build_identity.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
