# SubAI default audit rule package v1 (plan §20).
# Declarative matchers only; complex patterns run on Go's linear-time regexp
# engine (RE2). Matching always happens on the normalized copy (lowercased,
# zero-width stripped); original request text is never altered.
# "structural" matchers are enforced in the gateway pipeline before rule
# evaluation; they are listed here so admins can see and govern them.
rules:
  - id: SECRET-001
    version: 1
    category: secret
    title: 完整 PEM 私钥块
    description: 匹配 BEGIN/END 私钥边界且载荷非占位。公开证书与公钥不命中。
    scope: [input, instructions, tool_definition, tool_call, tool_result, quoted_text]
    enabled: true
    matcher:
      type: pem_private_key
      pattern: '-----begin [a-z0-9 ]*private key-----[a-z0-9\s+/=]{40,}-----end [a-z0-9 ]*private key-----'
    action: block
    severity: high
    message: 请求疑似包含私钥，请移除后重试。
    fixture_set: secret_001

  - id: SECRET-002
    version: 1
    category: secret
    title: 凭证文件内容被附带提交
    description: 云凭证文件结构字段组合；仅提到文件名不拦截。
    scope: [input, instructions, tool_result, quoted_text]
    enabled: true
    matcher:
      type: secret_file
      all:
        - ['aws_access_key_id', 'aws_secret_access_key', 'aws_session_token', 'az client_secret', 'client_secret =']
        - ['[default]', '[profile', 'credential_file', 'credentials file', 'ini']
      distance: 400
    action: review
    severity: high
    message: 请求疑似包含凭证文件内容，已暂停等待人工复核。
    fixture_set: secret_002

  - id: SECRET-003
    version: 1
    category: secret
    title: 带非占位密码的数据库连接串
    description: 解析常见 URI scheme 的 user:password 结构；模板 ${PASSWORD} 等仍正常送审。
    scope: [input, instructions, tool_definition, tool_call, tool_result, quoted_text]
    enabled: true
    matcher:
      type: connection_string
      pattern: '(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp|mssql|mailto)://[a-z0-9._~-]{1,64}:[^/\s@":]{6,}@'
    action: review
    severity: high
    message: 请求疑似包含带密码的连接串，已暂停等待人工复核。
    fixture_set: secret_003

  - id: SECRET-004
    version: 1
    category: secret
    title: 高可信访问密钥格式
    description: 每种格式单独枚举来源；结构化前缀+定长载荷，不靠单一 sk- 前缀定性。
    scope: [input, instructions, tool_definition, tool_call, tool_result, quoted_text]
    enabled: true
    matcher:
      type: access_key
      pattern: '(akia[0-9a-z]{16}|aiza[0-9a-z_-]{30,40}|gh[pousr]_[0-9a-z]{30,60}|xox[abprs]-[0-9a-z-]{20,}|sk-[a-z0-9_-]{40,})'
    action: review
    severity: high
    message: 请求疑似包含访问密钥，已暂停等待人工复核。
    fixture_set: secret_004

  - id: CONTENT-001
    version: 1
    category: content
    title: 风险词与行为意图组合
    description: 危害/窃取意图与对象组合；独立词不硬阻断，flag 后继续官方审核。
    scope: [input, instructions, quoted_text]
    enabled: true
    matcher:
      type: keyword_combo
      all:
        - ['how to kill', 'how to poison', 'how to make a bomb', 'build a bomb', 'how to hack into', 'steal credentials from', 'steal credit card', 'launder money', 'counterfeit passport']
        - ['a person', 'someone', 'my neighbor', 'my school', 'a bank', 'credit card', 'wifi network', 'government system', 'company account']
      distance: 300
    action: flag
    severity: high
    message: 请求包含风险意图组合线索，已记录并提交官方审核。
    fixture_set: content_001

  - id: INJECTION-001
    version: 1
    category: injection
    title: 外部内容要求覆盖原任务
    description: 标记覆盖指令来源；不执行其中指令，也不断言未命中即安全。
    scope: [tool_result, quoted_text, input, instructions]
    enabled: true
    matcher:
      type: injection_override
      pattern: '(ignore|disregard|forget|override)\s+(all\s+|the\s+)?(previous|prior|above|earlier|original|system)\s+(instructions?|prompts?|rules?|directions?)|[你请](现在)?忽略(以上|之前|上述|系统)|无视(以上|之前|上述)(指令|规则)'
    action: flag
    severity: medium
    message: 检测到疑似提示词注入指令，已标记；本地注入检测不完整，结果以官方审核与本记录共同为准。
    fixture_set: injection_001

  - id: INJECTION-002
    version: 1
    category: injection
    title: 覆盖指令同时索取凭证或要求外传
    description: 组合匹配并返回定位区间，不打印内容。
    scope: [tool_result, quoted_text, input]
    enabled: true
    matcher:
      type: exfil_combo
      all:
        - ['ignore previous', 'ignore all previous', 'disregard the above', 'disregard all previous', '忽略以上', '忽略之前', '无视上述']
        - ['api key', 'password', 'credentials', 'private key', 'token', 'send to', 'post to', 'upload', 'exfiltrate', '外传', '发到', '上传到']
      distance: 400
    action: review
    severity: high
    message: 注入指令与凭证/外传要求组合出现，已暂停等待人工复核。
    fixture_set: injection_002

  - id: EXFIL-001
    version: 1
    category: exfil
    title: 读取敏感内容并发送外部
    description: 仅对结构化工具参数判断；不可解析脚本不得宣称安全。
    scope: [tool_definition, tool_call, tool_result]
    enabled: true
    matcher:
      type: exfil_combo
      all:
        - ['~/.ssh', '/.aws/credentials', '.env', 'keychain', 'id_rsa', 'credentials.json', '/etc/shadow', 'private_key']
        - ['curl -d', 'requests.post', 'fetch(', 'http post', 'https post', 'upload to', 'send to', 'webhook', 'xmlhttprequest']
      distance: 800
    action: review
    severity: high
    message: 检测到读取敏感位置并向外发送的工具参数组合，已暂停。
    fixture_set: exfil_001

  - id: FORMAT-001
    version: 1
    category: format
    title: 请求体超过配置上限
    description: 在读取过程中限制（解压后同样限制），不允许全量读完再检查。
    scope: [input]
    enabled: true
    matcher:
      type: structural
    action: reject
    severity: medium
    message: 请求体超过大小上限。
    fixture_set: format_001

  - id: FORMAT-002
    version: 1
    category: format
    title: 无效或过深的 JSON 结构
    description: 深度与字段数量上限，避免解析资源耗尽。
    scope: [input]
    enabled: true
    matcher:
      type: structural
    action: reject
    severity: medium
    message: 请求 JSON 无效或结构过深。
    fixture_set: format_002

  - id: FORMAT-003
    version: 1
    category: format
    title: 严格模式不支持的输入
    description: 返回具体不支持的内容类型，如服务端历史引用、不可见上下文。
    scope: [input]
    enabled: true
    matcher:
      type: structural
    action: unsupported
    severity: medium
    message: 请求包含审核无法访问的输入类型。
    fixture_set: format_003
