name: subai

services:
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/lib/postgresql/data/log
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_rotation_age=1d
    environment:
      POSTGRES_USER: subai
      POSTGRES_PASSWORD: ${SUBAI_DB_PASSWORD:?set in .env}
      POSTGRES_DB: subai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subai -d subai"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: none
    restart: unless-stopped

  server:
    image: docker.io/allen0039/subai-server:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SUBAI_LISTEN: ":8080"
      SUBAI_DATABASE_URL: postgres://subai:${SUBAI_DB_PASSWORD:?set in .env}@db:5432/subai?sslmode=disable
      SUBAI_MASTER_KEY: ${SUBAI_MASTER_KEY:?set in .env}
      TZ: Asia/Shanghai
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ./subai-server >>/logs/server.log 2>&1"]
    volumes:
      - ./logs:/logs
    ports:
      - "127.0.0.1:${SUBAI_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: none
    restart: unless-stopped
